[project]
name = "ecommerce-agent"
version = "0.1.0"
description = "掌柜 —— 电商运营团队的 AI 助手（查数分析 / 文案生成 / 售后问答 / 文档处理）"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "dashscope>=1.26.3",
    "fastapi>=0.139.2",
    "html2text>=2025.4.15",
    "lxml>=6.1.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]          # 只收 tests/ 下的用例（scripts/ 里的冒烟脚本不算测试）
asyncio_mode = "auto"          # async 测试函数不用每个都加 @pytest.mark.asyncio
pythonpath = ["."]             # 让 tests 里能 import backend.*（等价运行时的 PYTHONPATH=.）
addopts = "-q"
