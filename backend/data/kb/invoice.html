<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>发票与报销</title>
</head>
<body>
<main>
  <h1>发票与报销</h1>

  <h2>开票类型</h2>
  <p>支持增值税普通发票与增值税专用发票。企业开具专票需在下单时填写公司全称、税号、开户行及账号。</p>

  <h2>抬头与信息修改</h2>
  <p>订单未开票前可在「订单详情-发票」自行修改抬头；已开票订单需在开票后 7 天内申请作废重开，每个订单仅支持重开一次。</p>

  <h2>电子发票与重发</h2>
  <p>电子发票开具后 24 小时内发送至下单邮箱；未收到可在订单详情点击「重发发票」，每月最多重发 3 次。</p>

  <h2>企业报销与纸质发票</h2>
  <p>需纸质发票报销的，请在订单完成后 90 天内申请，我们按收货地址寄送纸质发票。</p>
  <p>发票金额仅含商品实付金额，运费与优惠券抵扣部分不单独开票。</p>
</main>
</body>
</html>
