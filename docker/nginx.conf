# 前端容器里的 nginx：静态文件 + /api 反代到后端容器
# 只监听 80（先用 IP 访问，不上 HTTPS —— 要加域名时在这里补 443 和证书）
server {
    listen 80;
    server_name _;

    # 上传文档（PDF/Word）走 /api/upload，nginx 默认 1m 会直接 413
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1k;

    # ===== /api → 后端容器 =====
    # 注意 proxy_pass 结尾**没有**斜杠：/api/chat 原样转发成 /api/chat。
    # 加了斜杠（http://backend:8000/）会把 /api 前缀剥掉，后端全部 404。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 必配，否则打字机效果直接废掉 =====
        # nginx 默认会把上游响应攒满一个 buffer 才往下发，EventStream 会被整段卡住，
        # 前端表现为"转很久，然后报告一次性全冒出来"。关掉缓冲才能逐 token 推送。
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;      # 压缩也会攒数据，SSE 路径上必须关

        # 一轮对话最长 4 分钟（AGENT_BUDGET_SECONDS=240），超时要大于它，
        # 否则 nginx 会在报告生成到一半时切断连接（前端看到流断在中途）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== 静态文件 + SPA 路由 =====
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 前端是单页应用：/dashboard 这种路径磁盘上没有对应文件，
        # 直接 404 会让刷新页面挂掉。兜底回 index.html 交给前端路由。
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存（内容变了文件名就变）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
